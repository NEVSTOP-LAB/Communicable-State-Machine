# Merged LabVIEW CI workflow
# Combines the previous pipeline into one job with the order:
#   Check_Broken_VIs -> Build_VIPM_Library -> Run_Testcases
# All steps run sequentially on the SAME (self-hosted) machine with a SINGLE checkout.
#
# Trigger paths-ignore note:
#   The original three workflows had slightly different ignore lists
#   (Build_VIPM_Library ignored 'testcases/**' and 'src/_TEST/**' but not '**.vipb';
#    Check_Broken_VIs / Run Testcases ignored '**.vipb' but not 'testcases/**').
#   To keep this merged workflow triggering whenever ANY original workflow
#   would have triggered, only the intersection of the ignore lists is used.
# 本次修订从 push.paths-ignore 移除 '**.yml'：工作流自身的改动也需要一次构建验证。

name: LabVIEW CI

# 同一分支/标签的多次触发只保留最新一次运行：新 push 自动取消进行中的上一次运行，
# 避免多次提交在自托管 runner 上重复构建、排队积压（与 usermanual-ci.yml 同款配置）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Controls when the workflow will run
on:
  # 触发方式：push（任意分支）+ 手动 workflow_dispatch。
  # 不使用 pull_request(closed)：该事件下 github.ref 是 base 分支（main），与合并产生
  # 的 push(main) 进入同一个 concurrency 组，先启动的 push 运行会被后启动的 closed
  # 运行取消，main 的构建与 FTP 归档因此丢失。
  # paths-ignore 不含 '**.yml'：工作流/配置文件的改动同样需要一次构建验证。
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.drawio'
      - '**.png'
      - '**.svg'
      - '**.json'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Single job: all steps run sequentially on the SAME (self-hosted) machine.
  labview_ci:
    # The type of runner that the job will run on
    runs-on: [self-hosted, lv2017]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Get env variables
      # https://github.com/marketplace/actions/github-environment-variables-action
      - uses: FranzDiebold/github-env-vars-action@v2

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.2.2

      # --- Step 1: Check for broken VIs ---
      - id: Check_Broken_VIs
        uses: NEVSTOP-LAB/lvCICD@main
        with:
          LabVIEW_Version: 2017
          Operation: VIAn_CheckBrokenVIs
          Parameter1: ${{ github.workspace }}
          Parameter2: NOPASSWORD
          Parameter3: YES
          Parameter4: -placeContent
        timeout-minutes: 5

      # --- Step 2: Build the VIPM library ---
      - name: BuildDailyVIP
        id: build-vip
        uses: NEVSTOP-LAB/vipm-BuildViPackage@main
        with:
          LabVIEW_Version: 2017
          VipbPath: ${{ github.workspace }}
        timeout-minutes: 60
        continue-on-error: true

      - name: Retry BuildDailyVIP if failed
        id: retry-build-vip
        if: ${{ steps.build-vip.outcome == 'failure' }}
        uses: NEVSTOP-LAB/vipm-BuildViPackage@main
        with:
          LabVIEW_Version: 2017
          VipbPath: ${{ github.workspace }}
        timeout-minutes: 60

      - name: Upload a Build Artifact
        id: upload-build-artifact
        uses: actions/upload-artifact@v4.3.2
        continue-on-error: true
        with:
          # Artifact name
          name: ${{ steps.retry-build-vip.outputs.vipName || steps.build-vip.outputs.vipName }}
          path: ${{ steps.retry-build-vip.outputs.vipPathName || steps.build-vip.outputs.vipPathName }}
          # The desired behavior if no files are found using the provided path.
          if-no-files-found: warn
          retention-days: 90

      - name: Retry Upload a Build Artifact
        if: ${{ steps.upload-build-artifact.outcome == 'failure' }}
        uses: actions/upload-artifact@v4.3.2
        continue-on-error: true
        with:
          # Artifact name
          name: ${{ steps.retry-build-vip.outputs.vipName || steps.build-vip.outputs.vipName }}
          path: ${{ steps.retry-build-vip.outputs.vipPathName || steps.build-vip.outputs.vipPathName }}
          # The desired behavior if no files are found using the provided path.
          if-no-files-found: warn
          retention-days: 90

      # Backup generated files by ftp
      # https://github.com/marketplace/actions/simple-ftp-upload
      - name: backup Build Artifact by ftp
        uses: dennisameling/ftp-upload-action@v1.0.9
        with:
          server: ${{ secrets.VIPM_FTP_IP }}
          port: ${{ secrets.VIPM_FTP_PORT }}
          username: ${{ secrets.VIPM_FTP_USER }}
          password: ${{ secrets.VIPM_FTP_PASSWORD }}
          secure: false
          server_dir: /${{ env.CI_REPOSITORY_OWNER_SLUG }}/${{ env.CI_REPOSITORY_NAME }}/${{ env.CI_ACTION_REF_NAME }}/
          local_dir: ./vip/

      # --- Step 3: Run test cases ---
      - name: Run lvCICD Test cases with VITester
        id: StartVITester
        uses: NEVSTOP-LAB/lvCICD@main
        with:
          LabVIEW_Version: 2017
          Operation: StartVITester
          Parameter1: ${{ github.workspace }}\Communicable State Machine(CSM).lvproj
        timeout-minutes: 60
